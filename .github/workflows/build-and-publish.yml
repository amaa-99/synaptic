name: Build and Publish Debian Package

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {} # allow manual runs

jobs:

  build:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    env:
      PACKAGE: synaptic
      SIGN_KEY: ${{ secrets.GPG_KEY_ID }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Set the version
        id: version
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*version[[:space:]]*:[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" source/meson.build | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not find the version in meson.build" >&2
            exit 1
          fi
          VERSION="${VERSION}+git${GITHUB_SHA::7}"
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-cache/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('source/debian/control') }}
          restore-keys: |
            ${{ runner.os }}-apt-          

      - name: Install build dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/apt-cache/archives/partial"
          sudo apt update
          sudo apt -o Dir::Cache::archives="$RUNNER_TEMP/apt-cache/archives" build-dep -y ./source

      - name: Import GPG key
        if: env.SIGN_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import
          # Trust the key
          echo -e "5\ny\n" | gpg --command-fd 0 --expert --edit-key $SIGN_KEY trust

      - name: Create the source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          tar czf "${PACKAGE}_${VERSION}.orig.tar.gz" --exclude='./.*' -C source .

      - name: Build the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          # Update the changelog version to match tag
          cd source
          dch -v "${VERSION}-1" "Release ${VERSION}"
          # Build; -us -uc skips GPG signing here (it will be signed later if needed)
          debuild -us -uc -z9
          ls ../*

      - name: Sign the source package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        if: env.SIGN_KEY != ''
        run: |
          #cd ..
          debsign -k$SIGN_KEY ${PACKAGE}_${VERSION}-1_source.changes

      - name: Sign the binary package
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.SIGN_KEY != ''
        run: |
          debsign -k$SIGN_KEY --gpg-opts="--batch --pinentry-mode loopback --passphrase $GPG_PASSPHRASE" *.changes

      - name: List files
        run: |
          pwd
          ls *

      - name: Upload packages to the workflow's artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}

        # Example generated files:
        #
        #  synaptic-dbgsym_0.92+gitc36cf57-1_amd64.ddeb
        #  synaptic_0.92+gitc36cf57-1.dsc
        #  synaptic_0.92+gitc36cf57-1.tar.xz
        #  synaptic_0.92+gitc36cf57-1_amd64.build
        #  synaptic_0.92+gitc36cf57-1_amd64.buildinfo
        #  synaptic_0.92+gitc36cf57-1_amd64.changes
        #  synaptic_0.92+gitc36cf57-1_amd64.deb
        #  synaptic_0.92+gitc36cf57.orig.tar.gz          

        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: package-files
          path: |
            **/synaptic-dbgsym_*
            **/synaptic_*

      - name: Upload packages to the workflow's artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          #name: deb-file
          path: |
            **/*.deb

      - name: Publish to GitHub Release
        #if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          pwd
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --generate-notes
          gh release upload "v${VERSION}" *.deb --clobber

      - name: Update Packages index
        if: always()
        run: |
          mkdir -p repo
          cp ../*.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          git checkout -b packages-index
          git add Packages.gz
          git commit -m "Update Packages index for ${{ steps.source.outputs.version }}"
          git push origin packages-index
