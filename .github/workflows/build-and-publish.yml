name: Build and Publish Debian Package

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {} # allow manual runs

jobs:

  build:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    env:
      PACKAGE: synaptic
      REPO: ${{ github.repository }}
      SIGN_KEY: ${{ secrets.GPG_KEY_ID }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt build-dep -y ./

      - name: Import GPG key
        if: env.SIGN_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import
          # Trust the key
          echo -e "5\ny\n" | gpg --command-fd 0 --expert --edit-key $SIGN_KEY trust

      - name: Create source tarball and version
        id: source
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*version[[:space:]]*:[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" meson.build | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not find version in meson.build" >&2
            exit 1
          fi
          VERSION="${VERSION}+git${GITHUB_SHA::7}"
          tar czf "../${PACKAGE}_${VERSION}.orig.tar.gz" --exclude=.git .
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build source package
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          cp -r debian ${PACKAGE}-${VERSION}
          cd ${PACKAGE}-${VERSION}
          # Update the changelog version to match tag
          dch -v "${VERSION}-1" "Release ${VERSION}"
          # Build; -us -uc skips GPG signing here (it will be signed later if needed)
          debuild -S -us -uc

      - name: Sign source package
        if: env.SIGN_KEY != ''
        run: |
          cd ..
          debsign -k$SIGN_KEY ${PACKAGE}_${{ steps.source.outputs.version }}-1_source.changes

      - name: Build binary package
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          cd ${PACKAGE}-${VERSION}
          # -us -uc skips signing, matching the source build
          # -b builds binary packages only
          debuild -us -uc -b

      - name: Sign binary package
        if: env.SIGN_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          debsign -k$SIGN_KEY --gpg-opts="--batch --pinentry-mode loopback --passphrase $GPG_PASSPHRASE" *.changes

      - name: Upload packages to the workflow's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: |
            **/*.deb
            **/*.changes
            **/*.buildinfo

      - name: Publish to GitHub Release
        #if: startsWith(github.ref, 'refs/tags/')
        env:
            VERSION: ${{ steps.source.outputs.version }}
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
            gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --generate-notes
            gh release upload "v${VERSION}" *.deb *.changes *.buildinfo --clobber

      - name: Update Packages index
        if: always()
        run: |
          mkdir -p repo
          cp ../*.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          git checkout -b packages-index
          git add Packages.gz
          git commit -m "Update Packages index for ${{ steps.source.outputs.version }}"
          git push origin packages-index
