name: Build and Publish Debian Package

on:
  push:
    tags: [ 'v*.*' ]
  workflow_dispatch: {} # allow manual runs

jobs:

  build:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    env:
      PACKAGE: synaptic

    steps:

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0

      - name: Set the version
        id: version
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*version[[:space:]]*:[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" source/meson.build | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not find the version in meson.build" >&2
            exit 1
          fi
          VERSION="${VERSION}+git${GITHUB_SHA::7}"
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set the APT cache key
        id: apt-cache-key
        # Use the week number as a key, and refresh the cache weekly.
        run: echo "key=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
          
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-cache
          key: apt-publish-${{ runner.os }}-${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            apt-publish-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/apt-cache/archives/partial"
          ls $RUNNER_TEMP/apt-cache/*
          sudo chown -R runner:runner $RUNNER_TEMP/apt-cache
          sudo apt update
          sudo apt -o Dir::Cache="$RUNNER_TEMP/apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Languages=none -o APT::Install-Recommends=false build-dep -y ./source
          sudo apt -o Dir::Cache="$RUNNER_TEMP/apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Languages=none -o APT::Install-Recommends=false autoclean -y
          sudo chown -R runner:runner $RUNNER_TEMP/apt-cache

      - name: Build the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "PACKAGE=[${PACKAGE}] VERSION=[${VERSION}]"
          cd source
          # Update the changelog version to match tag
          dch -v "${VERSION}-1" "Release ${VERSION}"
          # Build
          dpkg-buildpackage -G -us -uc -j4 -z9 -I.* -ICMakeLists.txt -ICMakePresets.json

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --no-tty --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            gpg-connect-agent reloadagent /bye
          fi

      - name: Sign the packages
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.KEY_ID != ''
        run: |
          cd source
          KEY_ID=$(gpg --list-secret-keys --with-colons | cut -d: -f5 | head -n1)
          debsign -k${KEY_ID} -p'gpg --batch --passphrase $GPG_PASSPHRASE'

      - name: Upload packages archive to the workflow's artifacts

        # Example generated files:
        #  synaptic_0.92+gitc36cf57-1.dsc
        #  synaptic_0.92+gitc36cf57-1_amd64.buildinfo
        #  synaptic_0.92+gitc36cf57-1_amd64.changes
        #  synaptic_0.92+gitc36cf57-1_amd64.deb
        #  synaptic_0.92+gitc36cf57-1.tar.xz
        #  synaptic-dbgsym_0.92+gitc36cf57-1_amd64.ddeb

        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: package-files
          path: |
            **/synaptic-dbgsym_*
            **/synaptic_*

      - name: Upload .deb packages to the workflow's artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          #name: deb-file
          path: |
            **/*.deb

      - name: Publish to GitHub Release
        #if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd source
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            git log "$RANGE" --pretty=format:"%h: %B" > "$NOTES_FILE"
          else
            git log -n 20 --pretty=format:"%h: %B" > "$NOTES_FILE"
          fi
          cd ..
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --notes-file "$NOTES_FILE"
          gh release upload "v${VERSION}" *.deb --clobber

      - name: Update Packages index
        if: false
        run: |
          mkdir -p repo
          cp ../*.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          git checkout -b packages-index
          git add Packages.gz
          git commit -m "Update Packages index for ${{ steps.source.outputs.version }}"
          git push origin packages-index
